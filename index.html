function TrophyIcons({ count }) { if (!count) return null; return <span style={{ marginLeft: 4 }} title={`${count}x champion`}>{Array.from({ length: count }, (_, i) => <svg key={i} width="13" height="13" viewBox="0 0 24 24" fill="none" style={{ verticalAlign: "-1px", marginLeft: i > 0 ? -1 : 0 }}><path d="M7 4V2h10v2h3a2 2 0 012 2v1c0 2.5-1.5 4.5-3.7 5.3C17.3 16 15 17 13 17.5V20h3v2H8v-2h3v-2.5C9 17 6.7 16 5.7 13.3 3.5 12.5 2 10.5 2 8V6a2 2 0 012-2h3zm-3 4c0 1.3.8 2.5 2 3.2V6H4v2zm16 0V6h-2v5.2c1.2-.7 2-1.9 2-3.2z" fill="#c9b97a"/></svg>)}</span>; }

function useCountdown(target) { const [now, setNow] = useState(Date.now()); useEffect(() => { const id = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(id); }, []); const diff = Math.max(0, target - now); return { days: Math.floor(diff / 86400000), hours: Math.floor((diff % 86400000) / 3600000), minutes: Math.floor((diff % 3600000) / 60000), seconds: Math.floor((diff % 60000) / 1000) }; }
function CountdownUnit({ value, label }) { return <div style={{ textAlign: "center", minWidth: 70 }}><div style={{ fontSize: "clamp(36px, 8vw, 56px)", fontWeight: 700, color: "#c9b97a", fontFamily: "var(--heading)", lineHeight: 1 }}>{String(value).padStart(2, "0")}</div><div style={{ fontSize: 10, letterSpacing: 3, textTransform: "uppercase", color: "rgba(245,240,228,0.4)", marginTop: 6 }}>{label}</div></div>; }

function Nav({ active, setActive }) { return <nav style={{ position: "sticky", top: 0, zIndex: 50, background: "rgba(28,35,24,0.92)", backdropFilter: "blur(12px)", borderBottom: "1px solid rgba(255,255,255,0.06)" }}><div style={{ maxWidth: 1100, margin: "0 auto", padding: "0 24px", display: "flex", alignItems: "center", gap: 4, overflowX: "auto" }}><span style={{ fontFamily: "var(--heading)", fontSize: 15, color: "#c9b97a", letterSpacing: 1, whiteSpace: "nowrap", padding: "14px 10px 14px 0", borderRight: "1px solid rgba(255,255,255,0.08)", marginRight: 6 }}>20B</span>{NAV_ITEMS.map(item => <button key={item} onClick={() => setActive(item)} style={{ background: "none", border: "none", cursor: "pointer", padding: "14px 10px", fontSize: 11, letterSpacing: 1.2, textTransform: "uppercase", color: active === item ? "#c9b97a" : "rgba(255,255,255,0.4)", borderBottom: active === item ? "2px solid #c9b97a" : "2px solid transparent", transition: "all 0.2s", whiteSpace: "nowrap", fontWeight: 500 }}>{item}</button>)}</div></nav>; }
function ScheduleSection() { const [expanded, setExpanded] = useState(-1); const cols = "100px 1fr 90px 170px 70px"; return <Section id="Schedule" title="Tournament schedule" subtitle={`${SCHEDULE.length} rounds across 4 days and 5 courses — ${TOTAL_POINTS} total points up for grabs. Tap a round for tee times and rules.`}><div style={{ borderRadius: 10, overflow: "hidden", border: "1px solid rgba(255,255,255,0.06)" }}><div style={{ display: "grid", gridTemplateColumns: cols, gap: 0, padding: "10px 20px", background: "rgba(201,185,122,0.06)", fontSize: 9, letterSpacing: 1.5, textTransform: "uppercase", color: "rgba(201,185,122,0.6)", fontWeight: 600 }}><span>Date</span><span>Course</span><span>First tee</span><span>Format</span><span style={{ textAlign: "right" }}>Points</span></div>{SCHEDULE.map((r, i) => <div key={i}><div onClick={() => setExpanded(expanded === i ? -1 : i)} style={{ display: "grid", gridTemplateColumns: cols, gap: 0, padding: "14px 20px", background: i % 2 === 0 ? "rgba(42,51,37,0.5)" : "rgba(36,44,32,0.4)", alignItems: "center", cursor: "pointer" }}><div><div style={{ fontSize: 13, fontWeight: 600, color: "#f5f0e4" }}>{r.day}</div><div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)" }}>{r.date}</div></div><div><div style={{ fontSize: 14, fontWeight: 600, color: "#f5f0e4" }}>{r.course}</div>{r.note && <div style={{ fontSize: 10, letterSpacing: 1, textTransform: "uppercase", color: "#c9b97a", marginTop: 2 }}>{r.note}</div>}</div><div style={{ fontSize: 13, color: "rgba(255,255,255,0.5)", fontFamily: "monospace" }}>{r.firstTee}</div><div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 0.8, color: "#8b9a6b", display: "flex", alignItems: "center", gap: 4 }}>{r.format}<span style={{ fontSize: 10, color: "rgba(255,255,255,0.2)" }}>{expanded === i ? "▲" : "▼"}</span></div><div style={{ fontSize: 16, fontWeight: 700, color: "#c9b97a", textAlign: "right", fontFamily: "var(--heading)" }}>{r.points}</div></div>{expanded === i && <div style={{ padding: "10px 20px 14px 120px", background: i % 2 === 0 ? "rgba(42,51,37,0.35)" : "rgba(36,44,32,0.25)", fontSize: 12, color: "rgba(255,255,255,0.45)", lineHeight: 1.7 }}><div><span style={{ color: "#c9b97a", fontWeight: 600, fontSize: 10, letterSpacing: 1, textTransform: "uppercase" }}>Tee times: </span><span style={{ fontFamily: "monospace" }}>{r.teeTimes}</span></div><div><span style={{ color: "#c9b97a", fontWeight: 600, fontSize: 10, letterSpacing: 1, textTransform: "uppercase" }}>Rules: </span>{r.rules}</div></div>}</div>)}</div><p style={{ fontSize: 12, color: "rgba(255,255,255,0.35)", marginTop: 14, lineHeight: 1.6 }}><span style={{ color: "#c9b97a", fontWeight: 600 }}>Note:</span> {HANDICAP_NOTE}</p></Section>; }

function TeamsSection() { return <Section id="Teams" title="The teams" subtitle={`${TEAMS.patricks.members.length + TEAMS.eriks.members.length} players for the 5th Annual Invitational`}><div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 20 }}>{[TEAMS.patricks, TEAMS.eriks].map((team, ti) => <div key={ti} style={{ padding: 24, borderRadius: 12, background: "rgba(42,51,37,0.5)", border: `1px solid ${team.color}33` }}><div style={{ fontSize: 10, letterSpacing: 2, textTransform: "uppercase", color: team.color, marginBottom: 12, fontWeight: 600 }}>{team.label}</div><h3 style={{ fontSize: 20, fontWeight: 700, color: team.color, margin: "0 0 16px", fontFamily: "var(--heading)" }}>{team.name}</h3><div style={{ display: "flex", flexDirection: "column", gap: 6 }}>{team.members.map((m, j) => <div key={j} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", borderRadius: 6, background: "rgba(0,0,0,0.15)" }}><div style={{ width: 28, height: 28, borderRadius: "50%", background: `${team.color}22`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 600, color: team.color }}>{m.split(" ").map(w => w[0]).join("")}</div><span style={{ fontSize: 13, fontWeight: 500, color: "#f5f0e4" }}>{m}</span><TrophyIcons count={WIN_COUNTS[m]} />{j === 0 && <span style={{ marginLeft: "auto", fontSize: 9, letterSpacing: 1, textTransform: "uppercase", color: team.color, opacity: 0.7 }}>Captain</span>}</div>)}</div></div>)}</div>{(TEAMS.freeAgents.members.length > 0 || TEAMS.freeAgents.slots > 0) && <div style={{ padding: 20, borderRadius: 12, background: "rgba(42,51,37,0.3)", border: "1px solid rgba(255,255,255,0.05)", marginBottom: 20 }}><h3 style={{ fontSize: 14, fontWeight: 600, color: "rgba(255,255,255,0.5)", margin: "0 0 12px" }}>Free agents</h3><div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{TEAMS.freeAgents.members.map((m, j) => <span key={j} style={{ fontSize: 13, color: "#f5f0e4", padding: "6px 14px", borderRadius: 6, background: "rgba(0,0,0,0.15)" }}>{m}</span>)}{Array.from({ length: TEAMS.freeAgents.slots }, (_, j) => <span key={`s${j}`} style={{ fontSize: 12, color: "rgba(255,255,255,0.2)", padding: "6px 14px", borderRadius: 6, border: "1px dashed rgba(255,255,255,0.1)" }}>Open spot</span>)}</div></div>}<div style={{ padding: "16px 20px", borderRadius: 10, background: "rgba(201,185,122,0.06)", border: "1px solid rgba(201,185,122,0.12)", display: "flex", alignItems: "center", gap: 14 }}><div style={{ width: 40, height: 40, borderRadius: 8, background: "rgba(201,185,122,0.1)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#c9b97a" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg></div><div><div style={{ fontSize: 14, fontWeight: 600, color: "#c9b97a" }}>Handicaps</div><div style={{ fontSize: 13, color: "rgba(255,255,255,0.5)", lineHeight: 1.5, marginTop: 2 }}>Most matches are played at 85% (Best Ball at 90%). {HANDICAP_NOTE}</div></div></div></Section>; }
function LeaderboardSection() { const teams = [TEAMS.patricks, TEAMS.eriks]; const abbr = ["PB", "EB"]; return <Section id="Leaderboard" title="Live leaderboard" subtitle="Updated after each round — track the race for the Bussy Jacket"><div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 20 }}>{teams.map((t, i) => <div key={i} style={{ padding: 24, borderRadius: 12, background: "rgba(42,51,37,0.5)", border: `1px solid ${t.color}33`, textAlign: "center" }}><div style={{ fontSize: 10, letterSpacing: 2, textTransform: "uppercase", color: t.color, opacity: 0.7, marginBottom: 8 }}>{t.label}</div><div style={{ fontSize: 16, fontWeight: 700, color: t.color, fontFamily: "var(--heading)", marginBottom: 16 }}>{t.name}</div><div style={{ fontSize: 56, fontWeight: 700, color: t.color, fontFamily: "var(--heading)", lineHeight: 1 }}>0</div><div style={{ fontSize: 12, color: "rgba(255,255,255,0.35)", marginTop: 8 }}>points</div><div style={{ marginTop: 16, padding: "8px 14px", borderRadius: 6, background: "rgba(255,255,255,0.03)", fontSize: 12, color: "rgba(255,255,255,0.5)" }}>Need <strong style={{ color: t.color }}>{TO_WIN} points</strong> to claim the jacket</div></div>)}</div><div style={{ borderRadius: 10, overflow: "hidden", border: "1px solid rgba(255,255,255,0.06)" }}><div style={{ display: "grid", gridTemplateColumns: "1fr 80px 80px", gap: 0, padding: "10px 20px", background: "rgba(201,185,122,0.06)", fontSize: 9, letterSpacing: 1.5, textTransform: "uppercase", color: "rgba(201,185,122,0.6)", fontWeight: 600 }}><span>Round</span><span style={{ textAlign: "center" }}>{abbr[0]}</span><span style={{ textAlign: "center" }}>{abbr[1]}</span></div>{SCHEDULE.map((r, i) => <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr 80px 80px", gap: 0, padding: "12px 20px", background: i % 2 === 0 ? "rgba(42,51,37,0.5)" : "rgba(36,44,32,0.4)", alignItems: "center" }}><div><span style={{ fontSize: 13, color: "#f5f0e4", fontWeight: 500 }}>{r.format}</span><span style={{ fontSize: 11, color: "rgba(255,255,255,0.25)", marginLeft: 8 }}>{r.day} · {r.points} pts</span></div><div style={{ textAlign: "center", fontSize: 14, color: "rgba(255,255,255,0.15)" }}>{"—"}</div><div style={{ textAlign: "center", fontSize: 14, color: "rgba(255,255,255,0.15)" }}>{"—"}</div></div>)}<div style={{ display: "grid", gridTemplateColumns: "1fr 80px 80px", gap: 0, padding: "14px 20px", background: "rgba(201,185,122,0.06)" }}><span style={{ fontSize: 13, fontWeight: 700, color: "#c9b97a" }}>Total</span>{teams.map((t, i) => <span key={i} style={{ textAlign: "center", fontSize: 16, fontWeight: 700, color: t.color, fontFamily: "var(--heading)" }}>0</span>)}</div></div><div style={{ marginTop: 20, padding: "16px 20px", borderRadius: 10, background: "rgba(42,51,37,0.4)", border: "1px solid rgba(255,255,255,0.06)", display: "flex", alignItems: "center", gap: 14 }}><div style={{ width: 44, height: 44, borderRadius: 10, background: "linear-gradient(135deg, #4a7c59 0%, #2d5a3e 100%)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#fff" strokeWidth="1.5"/><circle cx="12" cy="12" r="3" fill="#fff" opacity="0.5"/></svg></div><div style={{ flex: 1 }}><div style={{ fontSize: 14, fontWeight: 600, color: "#f5f0e4" }}>Live scoring via Squabbit</div><div style={{ fontSize: 12, color: "rgba(255,255,255,0.4)", lineHeight: 1.5, marginTop: 2 }}>Download Squabbit for real-time scoring during the tournament.</div></div><a href="https://apps.apple.com/app/squabbit-golf" target="_blank" rel="noopener noreferrer" style={{ padding: "8px 16px", borderRadius: 6, background: "rgba(255,255,255,0.08)", color: "#f5f0e4", fontSize: 12, fontWeight: 600, textDecoration: "none", whiteSpace: "nowrap", border: "1px solid rgba(255,255,255,0.1)" }}>Get the app</a></div></Section>; }
function DetailsSection() { return <Section id="Details" title="Pricing & lodging" subtitle="Everything you need to know for the trip"><div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 20 }}><div style={{ padding: 24, borderRadius: 10, background: "rgba(42,51,37,0.5)", border: "1px solid rgba(255,255,255,0.06)" }}><h3 style={{ fontSize: 13, letterSpacing: 2, textTransform: "uppercase", color: "#c9b97a", margin: "0 0 20px", fontWeight: 500 }}>Cost</h3><div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", padding: "0 0 14px" }}><span style={{ fontSize: 16, fontWeight: 700, color: "#c9b97a" }}>All-in per person</span><span style={{ fontSize: 26, fontWeight: 700, color: "#c9b97a", fontFamily: "var(--heading)" }}>{COST.allIn}</span></div><p style={{ fontSize: 12, color: "rgba(255,255,255,0.4)", lineHeight: 1.6 }}>{COST.note}</p></div><div style={{ padding: 24, borderRadius: 10, background: "rgba(42,51,37,0.5)", border: "1px solid rgba(255,255,255,0.06)" }}><h3 style={{ fontSize: 13, letterSpacing: 2, textTransform: "uppercase", color: "#c9b97a", margin: "0 0 16px", fontWeight: 500 }}>Lodging</h3><p style={{ fontSize: 15, fontWeight: 600, color: "#f5f0e4", margin: "0 0 4px", fontFamily: "var(--heading)" }}>{LODGING.name}</p>{LODGING.url && <a href={LODGING.url} target="_blank" rel="noopener noreferrer" style={{ fontSize: 12, color: "#c9b97a", textDecoration: "underline", textUnderlineOffset: 2, display: "inline-block", marginBottom: 10 }}>View details</a>}<p style={{ fontSize: 12, color: "rgba(255,255,255,0.4)", lineHeight: 1.6, marginTop: 6 }}>{LODGING.note}</p></div></div><div style={{ padding: 20, borderRadius: 10, background: "rgba(42,51,37,0.4)", border: "1px solid rgba(255,255,255,0.06)" }}><h3 style={{ fontSize: 13, letterSpacing: 2, textTransform: "uppercase", color: "#c9b97a", margin: "0 0 14px", fontWeight: 500 }}>Rental car tracker</h3>{RENTAL_CARS.length === 0 && <p style={{ fontSize: 13, color: "rgba(255,255,255,0.35)", margin: "0 0 4px" }}>Car assignments coming soon.</p>}{RENTAL_CARS.map((car, ci) => <div key={ci} style={{ padding: 14, borderRadius: 8, background: "rgba(0,0,0,0.12)", marginBottom: 10 }}><div style={{ fontSize: 13, fontWeight: 600, color: "#f5f0e4", marginBottom: 8 }}>Driver: {car.driver}</div><div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>{car.passengers.map((p, pi) => <span key={pi} style={{ fontSize: 12, color: "#f5f0e4", padding: "4px 12px", borderRadius: 4, background: "rgba(201,185,122,0.08)" }}>{p}</span>)}{Array.from({ length: car.openSpots }, (_, j) => <span key={`o${j}`} style={{ fontSize: 11, color: "rgba(255,255,255,0.2)", padding: "4px 12px", borderRadius: 4, border: "1px dashed rgba(255,255,255,0.1)" }}>Open seat</span>)}</div></div>)}<p style={{ fontSize: 11, color: "rgba(255,255,255,0.3)", marginTop: 8, lineHeight: 1.5 }}>Reach out to drivers for a spot in their car, or contact Patrick if you're planning to drive.</p></div></Section>; }
function TravelSection() { return <Section id="Travel" title="Getting there" subtitle="French Lick is in southern Indiana — Louisville (SDF) is the closest major airport. Drive times are approximate."><div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>{AIRPORTS.map((a, i) => <div key={i} style={{ display: "grid", gridTemplateColumns: "60px 160px 1fr 110px", gap: 12, alignItems: "center", padding: "12px 16px", borderRadius: 8, background: i === 0 ? "rgba(201,185,122,0.06)" : "transparent", border: i === 0 ? "1px solid rgba(201,185,122,0.12)" : "1px solid transparent" }}><span style={{ fontFamily: "monospace", fontSize: 14, fontWeight: 700, color: i === 0 ? "#c9b97a" : "#f5f0e4", letterSpacing: 1 }}>{a.code}</span><span style={{ fontSize: 13, color: "rgba(255,255,255,0.5)" }}>{a.city}</span><div style={{ height: 6, borderRadius: 3, background: "rgba(255,255,255,0.05)", overflow: "hidden" }}><div style={{ height: "100%", width: `${a.pct * 100}%`, borderRadius: 3, background: i === 0 ? "#c9b97a" : "rgba(139,154,107,0.5)" }} /></div><span style={{ fontSize: 13, color: i === 0 ? "#c9b97a" : "rgba(255,255,255,0.5)", textAlign: "right", fontWeight: i === 0 ? 600 : 400 }}>{a.drive}</span></div>)}</div><div style={{ padding: "14px 18px", borderRadius: 8, background: "rgba(201,185,122,0.06)", border: "1px solid rgba(201,185,122,0.12)", fontSize: 13, color: "rgba(255,255,255,0.6)", lineHeight: 1.6 }}><span style={{ color: "#c9b97a", fontWeight: 600 }}>Chicago crew:</span> French Lick is roughly a 4.5-hour drive from Chicago — and on Eastern time, an hour ahead. Coordinate rides in the roster below.</div></Section>; }
function RosterSection() { const [participants, setParticipants] = useState([]); const [loading, setLoading] = useState(true); const [saving, setSaving] = useState(false); const [showForm, setShowForm] = useState(false); const [form, setForm] = useState({ name: "", handicap: "", ghin: "", airport: "", arrival: "", departure: "", carPlans: "" }); const [editIdx, setEditIdx] = useState(-1); useEffect(() => { fetchRoster().then(d => { setParticipants(d); setLoading(false); }); }, []); const handleSubmit = async () => { if (!form.name.trim()) return; setSaving(true); const entry = { ...form, handicap: form.handicap ? parseFloat(form.handicap) : null, id: editIdx >= 0 ? participants[editIdx].id : String(Date.now()) }; const success = await saveToSheet(editIdx >= 0 ? "update" : "add", entry); if (success) { setParticipants(await fetchRoster()); } else if (editIdx >= 0) { setParticipants(p => p.map((x, i) => i === editIdx ? entry : x)); } else { setParticipants(p => [...p, entry]); } resetForm(); setSaving(false); }; const handleDelete = async (i) => { setSaving(true); await saveToSheet("delete", participants[i]); const f = await fetchRoster(); setParticipants(f.length ? f : participants.filter((_, idx) => idx !== i)); setSaving(false); }; const resetForm = () => { setForm({ name: "", handicap: "", ghin: "", airport: "", arrival: "", departure: "", carPlans: "" }); setShowForm(false); setEditIdx(-1); }; const handleEdit = (i) => { const p = participants[i]; setForm({ name: p.name||"", handicap: p.handicap != null ? String(p.handicap) : "", ghin: p.ghin||"", airport: p.airport||"", arrival: p.arrival||"", departure: p.departure||"", carPlans: p.carPlans||"" }); setEditIdx(i); setShowForm(true); }; const inp = { width: "100%", padding: "10px 12px", borderRadius: 6, border: "1px solid rgba(255,255,255,0.1)", background: "rgba(0,0,0,0.2)", color: "#f5f0e4", fontSize: 13, outline: "none", boxSizing: "border-box" }; const lab = { fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", color: "rgba(255,255,255,0.4)", marginBottom: 4, display: "block" }; return <Section id="Roster" title="Participant roster" subtitle="Add your info so everyone can coordinate travel and tee times">{!showForm && <button onClick={() => { setShowForm(true); setEditIdx(-1); setForm({ name:"",handicap:"",ghin:"",airport:"",arrival:"",departure:"",carPlans:"" }); }} style={{ padding: "12px 24px", borderRadius: 8, border: "1px solid rgba(201,185,122,0.3)", background: "rgba(201,185,122,0.08)", color: "#c9b97a", cursor: "pointer", fontSize: 13, fontWeight: 600, marginBottom: 20, display: "block" }}>+ Add yourself</button>}{showForm && <div style={{ padding: 24, borderRadius: 10, background: "rgba(42,51,37,0.6)", border: "1px solid rgba(201,185,122,0.15)", marginBottom: 20 }}><div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14 }}><div><label style={lab}>Name *</label><input style={inp} value={form.name} onChange={e => setForm({...form,name:e.target.value})} placeholder="Your name" /></div><div><label style={lab}>Handicap index</label><input style={inp} type="number" step="0.1" value={form.handicap} onChange={e => setForm({...form,handicap:e.target.value})} placeholder="e.g. 12.4" /></div><div><label style={lab}>GHIN number</label><input style={inp} value={form.ghin} onChange={e => setForm({...form,ghin:e.target.value})} placeholder="e.g. 1234567" /></div></div><div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginTop: 14 }}><div><label style={lab}>Intended airport</label><select style={{...inp, appearance:"auto"}} value={form.airport} onChange={e => setForm({...form,airport:e.target.value})}><option value="">Select airport</option>{AIRPORTS.map(a => <option key={a.code} value={a.code}>{a.code} — {a.city}</option>)}</select></div><div><label style={lab}>Car plans</label><input style={inp} value={form.carPlans} onChange={e => setForm({...form,carPlans:e.target.value})} placeholder="Renting, need a ride, etc." /></div><div><label style={lab}>Arrival</label><input style={inp} value={form.arrival} onChange={e => setForm({...form,arrival:e.target.value})} placeholder="e.g. UA 442 — 10/13 @ 3 PM" /></div><div><label style={lab}>Departure</label><input style={inp} value={form.departure} onChange={e => setForm({...form,departure:e.target.value})} placeholder="e.g. AA 1187 — 10/17 @ 6 PM" /></div></div><div style={{ display: "flex", gap: 10, marginTop: 18 }}><button onClick={handleSubmit} disabled={saving} style={{ padding: "10px 24px", borderRadius: 6, border: "none", background: "#c9b97a", color: "#1c2318", cursor: "pointer", fontSize: 13, fontWeight: 700, opacity: saving ? 0.6 : 1 }}>{saving ? "Saving..." : editIdx >= 0 ? "Update" : "Save"}</button><button onClick={resetForm} style={{ padding: "10px 24px", borderRadius: 6, border: "1px solid rgba(255,255,255,0.1)", background: "transparent", color: "rgba(255,255,255,0.5)", cursor: "pointer", fontSize: 13 }}>Cancel</button></div></div>}{loading ? <p style={{ color: "rgba(255,255,255,0.3)", fontSize: 13 }}>Loading roster...</p> : participants.length === 0 ? <div style={{ textAlign: "center", padding: "40px 20px", color: "rgba(255,255,255,0.25)", fontSize: 13 }}>No participants yet — be the first to add your info.</div> : <div style={{ overflowX: "auto" }}><table style={{ width: "100%", borderCollapse: "separate", borderSpacing: "0 4px", fontSize: 13 }}><thead><tr style={{ fontSize: 9, letterSpacing: 1.5, textTransform: "uppercase", color: "rgba(255,255,255,0.2)" }}>{["Name","HCP","GHIN","Airport","Arrival","Departure","Car plans",""].map((h,i) => <th key={i} style={{ textAlign:"left",padding:"4px 8px",fontWeight:500 }}>{h}</th>)}</tr></thead><tbody>{participants.map((p,i) => <tr key={p.id||i} style={{ background: "rgba(42,51,37,0.35)" }}><td style={{ padding:"10px 12px",fontWeight:600,color:"#f5f0e4",borderRadius:"6px 0 0 6px" }}>{p.name}</td><td style={{ padding:"10px 8px",color: p.handicap!=null?"#c9b97a":"rgba(255,255,255,0.2)" }}>{p.handicap ?? "\u2014"}</td><td style={{ padding:"10px 8px",color:"rgba(255,255,255,0.4)",fontFamily:"monospace",fontSize:12 }}>{p.ghin||"\u2014"}</td><td style={{ padding:"10px 8px",color:"rgba(255,255,255,0.4)",fontFamily:"monospace" }}>{p.airport||"\u2014"}</td><td style={{ padding:"10px 8px",color:"rgba(255,255,255,0.35)",fontSize:11,maxWidth:130,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{p.arrival||"\u2014"}</td><td style={{ padding:"10px 8px",color:"rgba(255,255,255,0.35)",fontSize:11,maxWidth:130,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{p.departure||"\u2014"}</td><td style={{ padding:"10px 8px",color:"rgba(255,255,255,0.35)",fontSize:11,maxWidth:150,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{p.carPlans||"\u2014"}</td><td style={{ padding:"10px 8px",borderRadius:"0 6px 6px 0",whiteSpace:"nowrap" }}><button onClick={() => handleEdit(i)} style={{ background:"none",border:"none",color:"rgba(255,255,255,0.3)",cursor:"pointer",fontSize:11,padding:"4px 6px" }}>edit</button><button onClick={() => handleDelete(i)} style={{ background:"none",border:"none",color:"rgba(200,100,100,0.5)",cursor:"pointer",fontSize:11,padding:"4px 6px" }}>x</button></td></tr>)}</tbody></table></div>}</Section>; }
